<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UyBozor | O'zbekistonda uy-joy savdosi va ijarasi</title>
    <meta name="description" content="O'zbekiston bo'yicha ko'chmas mulk oldi-sotdisi va ijarasi e'lonlari platformasi" />
    
    <!-- DNS Prefetch & Preconnect for Fast Resource Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- Non-render-blocking Google Fonts with font-display: swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Non-render-blocking Leaflet CSS -->
    <link
      rel="preload"
      as="style"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
      />
    </noscript>

    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-display: swap;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
    <div id="root">
      <div style="min-height: 100vh; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif;">
        <!-- Instant Header Shell (FCP 0.3s) -->
        <header style="height: 72px; background: #ffffff; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; max-width: 1280px; margin: 0 auto;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 38px; height: 38px; border-radius: 12px; background: #059669; display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 18px;">U</div>
            <span style="font-weight: 900; font-size: 20px; color: #0f172a; letter-spacing: -0.5px;">Uy<span style="color: #059669;">Bozor</span></span>
          </div>
          <div style="display: flex; gap: 12px;">
            <div style="width: 110px; height: 38px; background: #f1f5f9; border-radius: 12px;"></div>
            <div style="width: 100px; height: 38px; background: #059669; border-radius: 12px;"></div>
          </div>
        </header>

        <!-- Instant Hero Shell -->
        <div style="background: linear-gradient(135deg, #064e3b 0%, #047857 50%, #022c22 100%); padding: 48px 16px 80px; text-align: center; color: white;">
          <div style="max-width: 768px; margin: 0 auto;">
            <div style="display: inline-block; padding: 6px 16px; background: rgba(255,255,255,0.12); border-radius: 9999px; font-size: 12px; font-weight: 600; margin-bottom: 16px;">
              ⭐ O'zbekistonda 10,000+ dan ortiq faol e'lonlar
            </div>
            <h1 style="font-size: clamp(24px, 5vw, 48px); font-weight: 900; line-height: 1.2; margin-bottom: 16px;">
              Orzuingizdagi uyni <span style="color: #fde047;">oson va tez</span> toping
            </h1>
            <p style="font-size: 14px; opacity: 0.9; max-width: 580px; margin: 0 auto;">
              Toshkent, Samarqand, Buxoro va barcha viloyatlar bo'yicha uylar va kvartiralar. To'g'ridan-to'g'ri egalaridan vositachisiz.
            </p>
          </div>
        </div>

        <!-- Instant Filter Shell -->
        <div style="max-width: 1280px; margin: -32px auto 0; padding: 0 16px;">
          <div style="background: white; border-radius: 24px; padding: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); height: 72px; border: 1px solid #f1f5f9;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
